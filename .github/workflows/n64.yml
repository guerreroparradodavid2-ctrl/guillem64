name: n64
on:
  push:
  workflow_dispatch:

jobs:
  rom:
    runs-on: ubuntu-latest
    container: ghcr.io/dragonminded/libdragon:preview
    steps:
      - uses: actions/checkout@v4

      - name: Instalar libdragon preview
        run: |
          git clone --depth 1 --branch preview https://github.com/DragonMinded/libdragon.git /tmp/libdragon
          cd /tmp/libdragon
          ./build.sh --no-examples

      - name: Compilar ROM
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: Guillem_N64
          path: guillem.z64
