name: n64
on:
  push:
  workflow_dispatch:

jobs:
  rom:
    runs-on: ubuntu-latest
    container: ghcr.io/dragonminded/libdragon:latest@sha256:9fe2843c9b7289393c1885be62391140e8b4cdb3edbc715f202dea16f554c5d2
    steps:
      - uses: actions/checkout@v4
      - name: Compilar ROM
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: Guillem_N64
          path: guillem.z64
