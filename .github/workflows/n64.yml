name: n64
on:
  push:
  workflow_dispatch:

jobs:
  rom:
    runs-on: ubuntu-latest
    env:
      N64_INST: /opt/libdragon
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev git curl
      - name: Toolchain MIPS (precompilado)
        run: |
          curl -fL -o toolchain.deb https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          sudo dpkg -i toolchain.deb
          ls /opt/libdragon/bin | head
      - name: libdragon (SDK)
        run: |
          git clone --depth 1 -b preview https://github.com/DragonMinded/libdragon.git
          cd libdragon
          sudo env N64_INST=/opt/libdragon "PATH=$PATH:/opt/libdragon/bin" ./build.sh
      - name: Compilar ROM
        run: |
          export PATH=$PATH:/opt/libdragon/bin
          make -j2
      - name: ROM compatible (CRC y tamano)
        run: |
          python3 tools/fixrom.py guillem.z64 Guillem_N64_compat.z64
          python3 tools/fixrom.py test.z64 Test_CPU_compat.z64
          python3 tools/fixrom.py hello.z64 Hola_compat.z64
          python3 tools/fixrom.py test32.z64 Test32_compat.z64
      - uses: actions/upload-artifact@v4
        with:
          name: Guillem_N64
          path: |
            guillem.z64
            test.z64
            Guillem_N64_compat.z64
            Test_CPU_compat.z64
            hello.z64
            Hola_compat.z64
            test32.z64
            Test32_compat.z64
